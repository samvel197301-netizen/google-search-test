<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Search</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Google Search</h1>

    <div class="search-box">

        <input
            id="query"
            type="text"
            placeholder="Zadej klíčové slovní spojení"
        >

        <button
            class="search-button"
            onclick="search()"
        >
            Hledat
        </button>

    </div>

    <div id="results"></div>

    <button
        class="download-button"
        onclick="downloadJSON()"
    >
        Stáhnout JSON
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
